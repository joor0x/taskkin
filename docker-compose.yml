version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskkin_postgres
    environment:
      POSTGRES_USER: taskkin
      POSTGRES_PASSWORD: taskkin_secure_pass
      POSTGRES_DB: taskkin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskkin"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskkin_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-06-06T09-36-42Z
    container_name: taskkin_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: taskkin_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskkin_backend
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://taskkin:taskkin_secure_pass@postgres:5432/taskkin
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
      - MINIO_BUCKET=taskkin-evidence
      - MINIO_SECURE=false
      - JWT_SECRET=super_secret_jwt_key_for_development_purposes_only_123456
      - ALLOW_LOCALHOST_WEBHOOKS=true
      - ENVIRONMENT=development
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskkin_celery_worker
    command: celery -A app.infrastructure.celery.celery_app worker --loglevel=info
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://taskkin:taskkin_secure_pass@postgres:5432/taskkin
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
      - MINIO_BUCKET=taskkin-evidence
      - MINIO_SECURE=false
      - JWT_SECRET=super_secret_jwt_key_for_development_purposes_only_123456
      - ALLOW_LOCALHOST_WEBHOOKS=true
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskkin_celery_beat
    command: celery -A app.infrastructure.celery.celery_app beat --loglevel=info
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://taskkin:taskkin_secure_pass@postgres:5432/taskkin
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
      - MINIO_BUCKET=taskkin-evidence
      - MINIO_SECURE=false
      - JWT_SECRET=super_secret_jwt_key_for_development_purposes_only_123456
      - ALLOW_LOCALHOST_WEBHOOKS=true
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskkin_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
