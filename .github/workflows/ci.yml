name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskkin
          POSTGRES_PASSWORD: taskkin_secure_pass
          POSTGRES_DB: taskkin
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Ruff Linter
      run: |
        ruff check backend/
        ruff format --check backend/

    - name: Run MyPy Typechecker
      run: |
        cd backend
        mypy app

    - name: Run pytest
      env:
        DATABASE_URL: postgresql+asyncpg://taskkin:taskkin_secure_pass@localhost:5433/taskkin
        REDIS_URL: redis://localhost:6379/0
        MINIO_ENDPOINT: localhost:9000
        MINIO_ACCESS_KEY: minioadmin
        MINIO_SECRET_KEY: minioadminpassword
        MINIO_BUCKET: taskkin-evidence
        MINIO_SECURE: false
        JWT_SECRET: super_secret_jwt_key_for_development_purposes_only_123456
        ALLOW_LOCALHOST_WEBHOOKS: true
        ENVIRONMENT: test
      run: |
        cd backend
        pytest --cov=app --cov-report=term-missing tests/

  frontend-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Next.js Lint and Build
      run: |
        cd frontend
        npm run lint
        npm run build
